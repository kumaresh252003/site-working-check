name: Build pages list

on:
  workflow_dispatch:      # run manually from the Actions tab whenever you add new pages

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Discover all pages
        run: python check_sites.py --discover

      - name: Commit pages.txt
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages.txt
          git commit -m "Update pages list" || echo "No changes"
          git push
